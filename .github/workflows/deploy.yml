name: Deploy

on:
  push:
    branches: [main]

jobs:
  # Sin los secretos de Supabase (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF) no hay
  # nada que desplegar: el workflow lo dice y termina sin fallar.
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF as repository secrets to enable it."
          fi

  deploy-functions:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.ready == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy optimize-tasks
        run: |
          supabase functions deploy optimize-tasks \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy debt-reflection
        run: |
          supabase functions deploy debt-reflection \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: deploy-functions
    defaults:
      run:
        working-directory: kairos

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --base-href /${{ github.event.repository.name }}/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: kairos/build/web
          cname: ''
