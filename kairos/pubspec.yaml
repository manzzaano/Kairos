name: kairos
description: KAIROS 3.0 — AI-powered productivity app with offline-first Realm storage and Supabase sync
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  realm: ^3.0.0
  dio: ^5.4.3
  get_it: ^7.7.0
  go_router: ^14.0.2
  dartz: ^0.10.1
  google_fonts: ^6.2.1
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.5.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/kairos_icon.png
    - assets/fonts/Inter-Light.ttf
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-Medium.ttf
    - assets/fonts/Inter-SemiBold.ttf
    - assets/fonts/JetBrainsMono-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/kairos_icon.png"
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: "assets/kairos_icon.png"
